<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Page - Spendora</title>

    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>

</head>
<body class="bg-secondary">
    <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <!-- indicators/dots -->
         <div class="carousel-indicators">
            <button data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
            <button data-bs-target="#demo" data-bs-slide-to="1"></button>
            <button data-bs-target="#demo" data-bs-slide-to="2"></button>
            <button data-bs-target="#demo" data-bs-slide-to="3"></button>
            <button data-bs-target="#demo" data-bs-slide-to="4"></button>
            <button data-bs-target="#demo" data-bs-slide-to="5"></button>
         </div>

        <!-- slideshow -->
         <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/pexels-jplenio-3131634.jpg" alt="mili" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="assets/pexels-laczadesign-17140515.jpg" alt="mminn" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="assets/pexels-maciej-cisowski-174297128-15046595.jpg" alt="mm" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="assets/pexels-jplenio-3131634.jpg" alt="vdvdv" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="assets/pexels-jplenio-3131634.jpg" alt="dsvsdvsd" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="assets/pexels-jplenio-3131634.jpg" alt="mwisho" class="d-block w-100">
            </div>
         </div>

        <!-- controls (left and right) -->

        <button class="carousel-control-prev" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
















    </div>
    
</body>
</html>
